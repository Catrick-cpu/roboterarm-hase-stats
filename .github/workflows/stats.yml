name: Update stats

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-stats
  cancel-in-progress: false

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: stats-repo
      - uses: actions/checkout@v4
        with:
          repository: HASE-HGV/Roboterarm-Hase
          ref: main
          fetch-depth: 0
          path: source
      - name: Generate stats and charts
        env:
          SOURCE_TOKEN: ${{ secrets.SOURCE_TOKEN }}
        run: python3 stats-repo/tools/stats.py --src source --out stats-repo --name HASE-HGV/Roboterarm-Hase
      - name: Commit if changed
        working-directory: stats-repo
        run: |
          git add -A -- '*.svg' stats.json
          if git diff --cached --quiet; then
            echo "No changes"; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update stats for HASE-HGV/Roboterarm-Hase [skip ci]"
          git push
